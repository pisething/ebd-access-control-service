databaseChangeLog:
  - changeSet:
      id: 002-create-access-role
      author: ingpiseth
      changes:
        - createTable:
            tableName: access_role
            columns:
              - column:
                  name: id
                  type: uuid
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: code
                  type: varchar(100)
                  constraints:
                    nullable: false
              - column:
                  name: name
                  type: varchar(150)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: varchar(500)
              - column:
                  name: role_type
                  type: varchar(50)
                  constraints:
                    nullable: false
              - column:
                  name: scope_type
                  type: varchar(50)
                  constraints:
                    nullable: false
              - column:
                  name: system_role
                  type: boolean
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: active
                  type: boolean
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp with time zone
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: created_by
                  type: uuid
              - column:
                  name: updated_at
                  type: timestamp with time zone
              - column:
                  name: updated_by
                  type: uuid
        - addUniqueConstraint:
            tableName: access_role
            columnNames: code
            constraintName: uk_access_role_code
        - createIndex:
            tableName: access_role
            indexName: idx_access_role_type_scope_active
            columns:
              - column:
                  name: role_type
              - column:
                  name: scope_type
              - column:
                  name: active