databaseChangeLog:
  - changeSet:
      id: 003-create-role-permission
      author: ingpiseth
      changes:
        - createTable:
            tableName: role_permission
            columns:
              - column:
                  name: id
                  type: uuid
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: role_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: permission_id
                  type: uuid
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: role_permission
            columnNames: role_id, permission_id
            constraintName: uk_role_permission
        - addForeignKeyConstraint:
            baseTableName: role_permission
            baseColumnNames: role_id
            referencedTableName: access_role
            referencedColumnNames: id
            constraintName: fk_role_permission_role
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableName: role_permission
            baseColumnNames: permission_id
            referencedTableName: access_permission
            referencedColumnNames: id
            constraintName: fk_role_permission_permission
            onDelete: CASCADE
        - createIndex:
            tableName: role_permission
            indexName: idx_role_permission_role
            columns:
              - column:
                  name: role_id
        - createIndex:
            tableName: role_permission
            indexName: idx_role_permission_permission
            columns:
              - column:
                  name: permission_id