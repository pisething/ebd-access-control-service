databaseChangeLog:
  - changeSet:
      id: 004-create-user-role
      author: ingpiseth
      changes:
        - createTable:
            tableName: user_role
            columns:
              - column:
                  name: id
                  type: uuid
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: role_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: scope_type
                  type: varchar(50)
                  constraints:
                    nullable: false
              - column:
                  name: scope_id
                  type: uuid
              - column:
                  name: active
                  type: boolean
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp with time zone
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: created_by
                  type: uuid
              - column:
                  name: updated_at
                  type: timestamp with time zone
              - column:
                  name: updated_by
                  type: uuid
        - addUniqueConstraint:
            tableName: user_role
            columnNames: user_id, role_id, scope_type, scope_id
            constraintName: uk_user_role_scope
        - addForeignKeyConstraint:
            baseTableName: user_role
            baseColumnNames: role_id
            referencedTableName: access_role
            referencedColumnNames: id
            constraintName: fk_user_role_role
        - createIndex:
            tableName: user_role
            indexName: idx_user_role_user_active
            columns:
              - column:
                  name: user_id
              - column:
                  name: active
        - createIndex:
            tableName: user_role
            indexName: idx_user_role_scope
            columns:
              - column:
                  name: scope_type
              - column:
                  name: scope_id
