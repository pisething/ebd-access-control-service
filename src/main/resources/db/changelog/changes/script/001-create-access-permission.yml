databaseChangeLog:
  - changeSet:
      id: 001-create-access-permission
      author: ingpiseth
      changes:
        - createTable:
            tableName: access_permission
            columns:
              - column:
                  name: id
                  type: uuid
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: code
                  type: varchar(100)
                  constraints:
                    nullable: false
              - column:
                  name: name
                  type: varchar(150)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: varchar(500)
              - column:
                  name: module
                  type: varchar(50)
                  constraints:
                    nullable: false
              - column:
                  name: active
                  type: boolean
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp with time zone
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: created_by
                  type: uuid
              - column:
                  name: updated_at
                  type: timestamp with time zone
              - column:
                  name: updated_by
                  type: uuid
        - addUniqueConstraint:
            tableName: access_permission
            columnNames: code
            constraintName: uk_access_permission_code
        - createIndex:
            tableName: access_permission
            indexName: idx_access_permission_module_active
            columns:
              - column:
                  name: module
              - column:
                  name: active